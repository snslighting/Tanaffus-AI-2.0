*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#17374e;font-family:Arial,sans-serif}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:white;border-bottom:1px solid #dce7ef}header a{color:#358bcc;text-decoration:none;font-size:13px}button{font:inherit;background:white;border:1px solid #d8e4ed;color:#426b88;padding:10px 17px;border-radius:7px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #6eb5ed;outline-offset:3px}.controls{display:flex;gap:10px;align-items:center;font-size:12px}.slide{display:none;width:min(1180px,94vw);min-height:665px;margin:28px auto;background:#fff;padding:55px 65px;box-shadow:0 10px 45px #2149650b;border:1px solid #dfe9f1;border-radius:8px;position:relative;overflow:hidden}.slide.active{display:block}.slide.cover{background:#ddecf8}.kicker{font-size:12px;letter-spacing:2px;color:#7194af;margin-bottom:19px}h1{font-size:43px;line-height:1.15;letter-spacing:-1.5px;font-weight:600;margin:0 0 30px;max-width:950px}.cover h1{font-size:76px;max-width:760px;margin:55px 0 35px}.body{font-size:24px;line-height:1.55;max-width:940px;margin:20px 0 28px;color:#56778f}.cover .body{font-size:29px}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:35px;margin:35px 0}.cols h2{font-size:19px;line-height:1.4;font-weight:600;color:#3386c8}.cols p{font-size:17px;line-height:1.65;color:#688396}.note{margin-top:30px;font-size:12px;line-height:1.6;color:#8b9dab;max-width:1000px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin:35px 0}.metrics strong{font-size:59px;letter-spacing:-2px;display:block;color:#358bcc}.metrics span{font-size:17px;color:#6c879b;display:block;margin-top:10px}table{width:100%;border-collapse:collapse;margin:25px 0;font-size:14px;line-height:1.5}th,td{padding:12px 14px;border-bottom:1px solid #e5edf3;text-align:left}th{background:#e9f3fa;color:#46738f}td{color:#6b8294}tr:nth-child(even) td{background:#f8fbfd}.steps{padding-left:25px}.steps li{font-size:20px;color:#5e8098;line-height:1.55;padding:9px 0 9px 8px}.screen{display:block;width:100%;height:435px;object-fit:contain;object-position:top;border:1px solid #e8eef3;background:#f8fbfe}.source-links{display:flex;flex-wrap:wrap;gap:15px;margin-top:13px}.source-links a{font-size:10px;color:#5793bb}.brand{font-size:21px;font-weight:600;letter-spacing:-1px}.brand em{font-style:normal;color:#80baf0}.notes{width:min(1120px,90vw);margin:0 auto 30px;font-size:13px;color:#7890a2;line-height:1.6}.notes summary{cursor:pointer;color:#3c85ba}.page-no{position:absolute;right:30px;bottom:22px;font-size:10px;color:#a2b4c3}.cover .kicker{margin-top:15px}.cover .note{margin-top:100px}.progress{height:3px;background:#dce9f3}.progress div{height:100%;background:#65ade3;transition:width .2s}@media(max-width:800px){header{padding:0 15px}.slide{padding:30px 24px;margin:18px auto;min-height:650px}h1{font-size:32px}.cover h1{font-size:52px}.cols,.metrics{grid-template-columns:1fr;gap:12px}.metrics strong{font-size:37px}.metrics{margin:20px 0}.metrics>div{display:flex;align-items:center;gap:20px}.metrics span{margin:0;font-size:14px}.body{font-size:19px}.cols{margin:15px 0}.cols h2{font-size:16px}.cols p{font-size:14px}.steps li{font-size:16px}table{font-size:11px;display:block;overflow:auto}th,td{padding:9px}.screen{height:370px}.controls button{padding:8px 11px}.controls{gap:7px}.controls>a{display:none}.brand{font-size:18px}.note{font-size:10px}}@media print{@page{size:landscape;margin:0}header,.progress,.notes{display:none}.slide,.slide.active{display:block;break-after:page;width:100vw;height:100vh;min-height:0;margin:0;border:0;border-radius:0;box-shadow:none;padding:35px 45px}.cols,.metrics{grid-template-columns:repeat(3,1fr)}.cover h1{font-size:65px}h1{font-size:36px}.screen{height:390px}.source-links{display:none}.note{font-size:10px}.cols p{font-size:14px}table{font-size:12px}th,td{padding:8px}.steps li{font-size:17px}}</style></head><body><header><span class="brand">tanaffus<em>.</em></span><div class="controls"><a href="/">Open prototype</a><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button><button onclick="window.print()">Print / PDF</button></div></header><div class="progress"><div id="progress"></div></div><main id="slides"></main><details class="notes"><summary>Presenter notes and assumptions</summary><p id="notes"></p></details><script type="module">
const data=await(await fetch('./pitch-data.json')).json();const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=Math.max(0,Math.min(data.length-1,Number(location.hash.slice(1)||1)-1));
document.querySelector('#slides').innerHTML=data.map((s,i)=>`<section class="slide ${s.kind==='cover'?'cover':''}" aria-label="Slide ${i+1}"><div class="kicker">${escape(s.subtitle)}</div><h1>${escape(s.title)}</h1>${s.metrics?`<div class="metrics">${s.metrics.map(([v,l])=>`<div><strong>${escape(v)}</strong><span>${escape(l)}</span></div>`).join('')}</div>`:''}${s.body?`<p class="body">${escape(s.body)}</p>`:''}${s.columns?`<div class="cols">${s.columns.map(([h,p])=>`<div><h2>${escape(h)}</h2><p>${escape(p)}</p></div>`).join('')}</div>`:''}${s.table?`<table>${s.table.map((r,j)=>`<tr>${r.map(c=>`<${j?'td':'th'}>${escape(c)}</${j?'td':'th'}>`).join('')}</tr>`).join('')}</table>`:''}${s.steps?`<ol class="steps">${s.steps.map(t=>`<li>${escape(t)}</li>`).join('')}</ol>`:''}${s.image?`<img class="screen" src="screens/${escape(s.image)}" alt="${escape(s.title)}">`:''}<p class="note">${escape(s.note||'')}</p>${s.sources?`<div class="source-links">${s.sources.map((u,j)=>`<a href="${u}" target="_blank" rel="noreferrer">Source ${j+1}: ${new URL(u).hostname}</a>`).join('')}</div>`:''}<span class="page-no">${String(i+1).padStart(2,'0')} / ${data.length}</span></section>`).join('');
function show(){document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===index));document.querySelector('#count').textContent=`${index+1} / ${data.length}`;document.querySelector('#notes').textContent=data[index].notes||data[index].note||'';document.querySelector('#progress').style.width=`${(index+1)/data.length*100}%`;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===data.length-1;location.hash=index+1;window.scrollTo(0,0)}function next(d){index=Math.max(0,Math.min(data.length-1,index+d));show()}document.querySelector('#next').onclick=()=>next(1);document.querySelector('#prev').onclick=()=>next(-1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next(1)}if(e.key==='ArrowLeft')next(-1)});show();
</script></body></html>
